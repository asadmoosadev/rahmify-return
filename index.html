<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-lw1noLs62Lj4kb20ellxU5sSMXMpd3gBglnonuWW/XA='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Back to Rahmify</title>
<style>
  :root { --bg: #0C1015; --surface: #151B23; --border: #263040; --text: #E9EEF4; --muted: #93A0B1; --accent: #45E5A0; --accent-text: #0C1015; color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #F4F6F9; --surface: #FFFFFF; --border: #DFE4EB; --text: #0E141B; --muted: #5B6675; --accent: #047857; --accent-text: #FFFFFF; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
         background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 28px 20px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -0.3px; }
  p { margin: 0; color: var(--muted); }
  a.button { display: block; margin: 24px 0 16px; padding: 15px; border-radius: 12px; background: var(--accent); color: var(--accent-text);
             font-weight: 600; text-decoration: none; }
  a.button[hidden] { display: none; }
  .small { font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Back to Rahmify</h1>
  <p id="note">Opening Rahmify to finish connecting your bank. If your iPhone asks, tap Open.</p>
  <a id="open" class="button" href="rahmify://callback">Open Rahmify</a>
  <p class="small">This page only hands you back to the app. It doesn't keep, show or send anything, and the one-time code in its address can't be used without your phone.</p>
</main>
<script>
  (function () {
    var query = window.location.search;
    var open = document.getElementById('open');
    var note = document.getElementById('note');
    if (!/[?&](code|error)=/.test(query)) {
      note.textContent = 'This page hands you back to Rahmify after you connect a bank. There is nothing to do here.';
      open.hidden = true;
      return;
    }
    var target = 'rahmify://callback' + query;
    open.href = target;
    window.location.replace(target);
  })();
</script>
</body>
</html>
